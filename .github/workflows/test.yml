name: Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"

jobs:
    a:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Build
          run: echo ${{ github.sha }} > test/Release.txt
        - name: Upload as artifact
          uses: actions/upload-artifact@v7
          with:
            path: test/Release.txt
            if-no-files-found: error
            archive: false

    b:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Build
          run: echo ${{ github.sha }} > test/Release2.txt
        - name: Upload as artifact
          uses: actions/upload-artifact@v7
          with:
            path: test/Release2.txt
            if-no-files-found: error
            archive: false
            
    build:
      runs-on: ubuntu-latest
      needs: [a, b]
      permissions:
        contents: write
      steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Build
          uses: actions/download-artifact@v8
          with:
            path: artifacts/
            merge-multiple: true
        - name: Release
          uses: softprops/action-gh-release@v3
          with:
            files: artifacts/*
            prerelease: ${{contains(github.ref_name, '-dev')}}
            generate_release_notes: true
