name: Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+"

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Build
          run: echo ${{ github.sha }} > Release.txt
        - name: Test
          run: cat Release.txt
        - name: Release
          uses: softprops/action-gh-release@v3
          with:
            files: |
              Release.txt
            prerelease: contains(github.ref_name, '-dev')
